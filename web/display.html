<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Flights overhead</title>
<!--
  Kiosk Flight display. Everything is local: no map tiles, no SDK, no images, no
  web fonts, no external requests of any kind. Aircraft positions arrive from the
  app as polar coordinates (bearing + km from the centre), already converted
  server-side, so this page only plots and labels them.
  Keep this script conservative (ES2017 at most): an unsupported operator kills
  the whole script on an old kiosk WebView, not just the line it is on.
-->
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#05080f;
    color:#e8f1ff;font-family:system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif}
  /* Night-sky wash + vignette: the numbers float over the map, nothing is boxed. */
  #stage{position:fixed;inset:0;
    background:
      radial-gradient(120% 120% at 50% 50%, rgba(56,189,248,.07) 0%, rgba(5,8,15,0) 55%),
      radial-gradient(140% 140% at 50% 50%, rgba(5,8,15,0) 45%, rgba(2,4,9,.92) 100%),
      linear-gradient(180deg,#070c16 0%,#04070d 60%,#03050a 100%)}
  #radar{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
  #grid,#trails{position:absolute;left:0;top:0}
  #plots{position:absolute;left:0;top:0;width:100%;height:100%}
  #sweep{position:absolute;left:0;top:0;width:100%;height:100%;
    animation:sweep 7s linear infinite;pointer-events:none}
  #sweep.off{display:none}
  @keyframes sweep{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  .ring{fill:none;stroke:rgba(148,197,255,.16);stroke-width:1}
  .ring.major{stroke:rgba(148,197,255,.22)}
  .tick{stroke:rgba(148,197,255,.28);stroke-width:1}
  .card{fill:rgba(200,225,255,.5);stroke:none;letter-spacing:.14em;
    font-family:ui-monospace,Menlo,Consolas,monospace;text-anchor:middle}
  .rlabel{fill:rgba(148,197,255,.42);stroke:none;
    font-family:ui-monospace,Menlo,Consolas,monospace}
  .cosmetic{fill:none;stroke:rgba(148,197,255,.10);stroke-width:1;stroke-dasharray:2 10}
  /* The sensor's own coverage: the display can only ever show what is inside it. */
  .areabox{fill:rgba(125,211,252,.035);stroke:rgba(125,211,252,.30);stroke-width:1;
    stroke-dasharray:7 7}
  .arealabel{fill:rgba(170,215,245,.62);stroke:none;letter-spacing:.06em;
    font-family:ui-monospace,Menlo,Consolas,monospace;text-anchor:middle}
  #home{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none}
  .home-dot{width:11px;height:11px;border-radius:50%;background:#eaf6ff;margin:0 auto;
    box-shadow:0 0 0 3px rgba(125,211,252,.25),0 0 18px rgba(125,211,252,.75)}
  /* The home-marker ripple.
     Two things used to make it twitch at the outer full width just before restarting:
       1. the expansion animated width/height/margin — LAYOUT properties, so at the loop
          boundary the new (tiny) geometry could paint a frame late while opacity had
          already jumped back up, showing the OLD 190px ring at full brightness;
       2. opacity ran .9 -> 0 and restarted at .9, so that stale frame was visible.
     Now: the expansion is a composited transform (will-change-promoted, no layout), the base
     state is invisible with animation-fill-mode:both (no unstyled frame), and the first 10%
     of every cycle is a fully transparent dead zone — the ring leaves the centre while
     nothing can be seen, so any lagging frame lands in an invisible window. */
  .home-pulse{position:absolute;left:50%;top:50%;width:190px;height:190px;
    margin:-95px 0 0 -95px;border-radius:50%;border:1px solid rgba(125,211,252,.55);
    transform:scale(.06);transform-origin:50% 50%;opacity:0;will-change:transform,opacity;
    animation:pulse 4s linear infinite both}
  .home-pulse.off{display:none}
  @keyframes pulse{
    0%{transform:scale(.06);opacity:0}
    10%{transform:scale(.18);opacity:0}
    24%{opacity:.60}
    60%{opacity:.32}
    100%{transform:scale(1);opacity:0}}
  .home-tag{position:absolute;left:50%;top:100%;transform:translate(-50%,6px);white-space:nowrap;
    font-size:11px;letter-spacing:.2em;color:rgba(200,225,255,.45);
    font-family:ui-monospace,Menlo,Consolas,monospace}
  #home.quiet .home-tag{display:none}
  .ac{position:absolute;transform:translate(-50%,-50%)}
  .glyph{width:34px;height:34px;display:block;transform-origin:50% 50%}
  .glyph path{fill:#9fd8ff;stroke:rgba(3,10,20,.55);stroke-width:.5}
  .ac.near .glyph path{fill:#eaf9ff}
  .ac.near .glyph{filter:drop-shadow(0 0 7px rgba(160,220,255,.85))}
  .ac .tag{position:absolute;top:50%;white-space:nowrap;line-height:1.25;
    text-shadow:0 0 6px rgba(0,0,0,.95),0 0 14px rgba(0,0,0,.9)}
  /* The label's side is decided per aircraft in JS and set inline, so no side class
     here: leaving both left: and right: applicable would stretch the box instead. */
  .call{display:block;font-weight:700;letter-spacing:.02em;font-size:2.5vmin;color:#f2f9ff;
    font-family:ui-monospace,Menlo,Consolas,monospace}
  .meta{display:block;font-size:1.85vmin;color:#a8cde8;
    font-family:ui-monospace,Menlo,Consolas,monospace}
  .route{display:block;font-size:1.7vmin;color:#7fa8c8;letter-spacing:.04em}
  .trend{font-weight:700}
  .trend.climb{color:#7ff0b0}.trend.descent{color:#ffcf8a}
  .trail{fill:none;stroke:#7dd3fc;stroke-width:1.6;stroke-opacity:.35;stroke-linejoin:round;
    stroke-linecap:round}
  #hud{position:absolute;left:4vmin;top:4vmin;max-width:44vmin;pointer-events:none}
  #count{font-size:13vmin;line-height:.86;font-weight:200;letter-spacing:-.02em;
    font-family:ui-monospace,Menlo,Consolas,monospace;color:#f4fbff;
    text-shadow:0 0 30px rgba(125,211,252,.35)}
  #hud-title{font-size:2.1vmin;letter-spacing:.34em;color:#8fb6d4;margin-top:.6vmin}
  #hud-sub{font-size:1.9vmin;color:#9fc4dd;margin-top:1.4vmin;line-height:1.5}
  #hud-sub b{color:#e9f6ff;font-weight:600}
  #hud-warn{font-size:1.75vmin;color:#ffcf8a;margin-top:1vmin}
  #notice{position:absolute;left:50%;top:50%;transform:translate(-50%,9vmin);text-align:center;
    max-width:70vmin;pointer-events:none}
  #notice .big{font-size:3vmin;letter-spacing:.28em;color:#dcecf8}
  #notice .small{font-size:1.9vmin;color:#7fa8c8;margin-top:1.4vmin;line-height:1.6}
  #notice.error{transform:translate(-50%,-50%)}
  #notice.error .big{font-size:2.6vmin;letter-spacing:.1em;color:#ffd7a1;font-family:inherit}
  #notice.error .small{color:#e3b98a}
  #foot{position:absolute;right:4vmin;bottom:3vmin;display:flex;justify-content:flex-end;
    font-size:1.6vmin;color:#9dc0d8;font-family:ui-monospace,Menlo,Consolas,monospace}
  /* Vignette, never a panel: dims whatever the detail block would otherwise sit on. */
  #scrim{position:absolute;left:0;right:0;bottom:0;height:28vmin;pointer-events:none;opacity:0;
    transition:opacity .25s ease;background:linear-gradient(180deg,
      rgba(3,6,12,0) 0%,rgba(3,6,12,.72) 40%,rgba(3,6,12,.94) 100%)}
  #scrim.on{opacity:1}
  #detail{position:absolute;left:50%;bottom:7vmin;transform:translate(-50%,0);padding:0;
    pointer-events:none;text-align:center;text-shadow:0 0 8px rgba(0,0,0,.95)}
  #detail .d-call{font-size:4.2vmin;font-weight:700;letter-spacing:.03em;
    font-family:ui-monospace,Menlo,Consolas,monospace;color:#ffffff}
  #detail .d-route{font-size:2.2vmin;color:#bcd9ee;margin-top:.6vmin}
  #detail .d-rows{font-size:1.7vmin;color:#b8d4e8;margin-top:1.4vmin;line-height:1.8;
    font-family:ui-monospace,Menlo,Consolas,monospace}
  #detail .d-rows span{margin:0 1.4vmin}
  @media (max-aspect-ratio:1/1){#hud{max-width:80vmin}#count{font-size:9vmin}}
  /* ---------------------------------------------------------------------- */
  /* The single-aircraft dashboard.                                        */
  /*                                                                       */
  /* A second full-screen view, not a panel over the radar: it replaces the */
  /* whole screen for one aircraft (the closest one, or the one that was    */
  /* tapped). #ds is the "Single-aircraft dashboard" text-size slider, and  */
  /* every size below is expressed as a multiple of the design size so one  */
  /* property scales the lot.                                              */
  /* ---------------------------------------------------------------------- */
  :root{--ds:1}
  #acdetail{position:fixed;inset:0;display:none;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;
    padding:4vmin;box-sizing:border-box;overflow:hidden;
    background:
      radial-gradient(120% 120% at 50% 45%, rgba(56,189,248,.08) 0%, rgba(5,8,15,0) 60%),
      linear-gradient(180deg,#070c16 0%,#04070d 60%,#03050a 100%)}
  body.detail #acdetail{display:flex}
  body.detail #radar,body.detail #hud,body.detail #foot,
  body.detail #detail,body.detail #scrim{display:none}
  #acdetail .ad-inner{display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:2.2vmin;max-width:96vw}
  /* Airline: the real logo on a light plate (the badge the code used to fill),
     or the coloured monogram when the logo is off, not fetched yet, or missing.
     The plate exists because several airlines' wordmarks are dark blue/navy —
     British Airways, American — and those vanish against a night-sky background.
     A logo is still never fetched by this page: the URI arrives in the payload. */
  #acdetail .ad-airline{display:flex;align-items:center;gap:2vmin}
  #acdetail .ad-badge{min-width:calc(9vmin * var(--ds));height:calc(9vmin * var(--ds));
    padding:0 calc(1.1vmin * var(--ds));border-radius:calc(1.6vmin * var(--ds));
    display:flex;align-items:center;justify-content:center;box-sizing:border-box;
    font-family:ui-monospace,Menlo,Consolas,monospace;
    font-weight:700;font-size:calc(3.6vmin * var(--ds));letter-spacing:.04em;
    color:#05080f;background:#9fd8ff;box-shadow:0 0 3vmin rgba(125,211,252,.25)}
  #acdetail .ad-badge.has-logo{background:rgba(238,245,255,.94);min-width:0}
  #acdetail .ad-badge img{display:block;max-height:calc(6.2vmin * var(--ds));
    max-width:calc(26vmin * var(--ds));width:auto;height:auto}
  #acdetail .ad-airline-text{text-align:left;line-height:1.25;max-width:56vmin}
  #acdetail .ad-airline-name{font-size:calc(3vmin * var(--ds));color:#e8f1ff;
    font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #acdetail .ad-flight{font-size:calc(10.5vmin * var(--ds));line-height:1;
    font-weight:700;letter-spacing:.02em;color:#f4fbff;
    font-family:ui-monospace,Menlo,Consolas,monospace;
    text-shadow:0 0 4vmin rgba(125,211,252,.35)}
  #acdetail .ad-schematic{height:calc(28vmin * var(--ds));color:#9fd8ff;
    display:flex;align-items:center;justify-content:center;
    filter:drop-shadow(0 0 2.2vmin rgba(125,211,252,.35))}
  /* The source art has a different viewBox (and aspect) per icon, so the icon  */
  /* is given a square box and `preserveAspectRatio` centres it inside.         */
  #acdetail .ad-schematic svg{height:100%;width:calc(44vmin * var(--ds));display:block}
  /* Aircraft type and altitude: the type is the interesting line, so it is the
     larger of the two and the altitude (which the schematic and the trend already
     imply is "up there") is smaller. Neither competes with the flight number. */
  #acdetail .ad-type{font-size:calc(4.8vmin * var(--ds));color:#eaf4ff;
    letter-spacing:.02em}
  #acdetail .ad-type .ad-code{color:#8fb6d4;margin-left:1.4vmin;
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.78em}
  #acdetail .ad-alt{font-size:calc(4vmin * var(--ds));color:#dcebf8;font-weight:600;
    font-family:ui-monospace,Menlo,Consolas,monospace;
    text-shadow:0 0 3vmin rgba(125,211,252,.3)}
  #acdetail .ad-alt .ad-alt-label{display:block;font-size:calc(1.7vmin * var(--ds));
    font-weight:400;letter-spacing:.3em;color:#8fb6d4;margin-bottom:.7vmin}
  #acdetail .ad-route{display:flex;align-items:center;justify-content:center;
    gap:2vmin;flex-wrap:wrap;margin-top:1vmin}
  #acdetail .ad-end{min-width:22vmin}
  #acdetail .ad-end .ad-code{display:block;font-size:calc(6.4vmin * var(--ds));
    font-weight:700;color:#ffffff;font-family:ui-monospace,Menlo,Consolas,monospace}
  #acdetail .ad-end .ad-city{display:block;font-size:calc(2.3vmin * var(--ds));
    color:#a8cde8;margin-top:.6vmin}
  #acdetail .ad-arrow{font-size:calc(4.6vmin * var(--ds));color:#7dd3fc}
  #acdetail .ad-empty{font-size:calc(3vmin * var(--ds));letter-spacing:.28em;color:#dcecf8}
  /* Several of these boxes are flex containers, and an author `display:flex`
     beats the user-agent `[hidden]{display:none}` — so hiding one would do
     nothing. Say it explicitly. */
  #acdetail [hidden]{display:none !important}
  /* Respect reduced-motion (and settle quickly when a page is captured headlessly). */
  @media (prefers-reduced-motion:reduce){
    #sweep{animation:none;opacity:.3}
    .home-pulse{animation:none;opacity:0}
  }
</style>
</head>
<body>
<div id="stage">
  <div id="radar">
    <svg id="grid" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="sweep"><svg id="sweep-svg" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <svg id="trails" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="plots"></div>
    <div id="home"><div class="home-pulse"></div><div class="home-dot"></div>
      <div class="home-tag">HOME</div></div>
    <div id="notice" hidden><div class="big"></div><div class="small"></div></div>
  </div>
</div>
<div id="hud"><div id="count">0</div><div id="hud-title">AIRCRAFT OVERHEAD</div>
  <div id="hud-sub"></div><div id="hud-warn"></div></div>
<div id="foot"><span>Flightradar24 via Home Assistant</span></div>
<div id="scrim"></div>
<div id="detail" hidden><div class="d-call"></div><div class="d-route"></div>
  <div class="d-rows"></div></div>
<!-- The single-aircraft dashboard: the whole screen for one aircraft. Shown when
     the display is set to be one, when the sky drops to a single aircraft, or
     when an aircraft is tapped (all optional — see the app's settings). -->
<div id="acdetail">
  <div class="ad-inner">
    <div class="ad-airline"><div class="ad-badge"><img class="ad-logo" alt="" hidden>
        <span class="ad-monogram"></span></div>
      <div class="ad-airline-text"><div class="ad-airline-name"></div></div></div>
    <div class="ad-flight"></div>
    <div class="ad-schematic"></div>
    <div class="ad-type"><span class="ad-model"></span><span class="ad-code"></span></div>
    <div class="ad-alt"><span class="ad-alt-label">ALTITUDE</span>
      <span class="ad-alt-value"></span></div>
    <div class="ad-route">
      <div class="ad-end ad-from"><span class="ad-code"></span><span class="ad-city"></span></div>
      <div class="ad-arrow">→</div>
      <div class="ad-end ad-to"><span class="ad-code"></span><span class="ad-city"></span></div>
    </div>
    <div class="ad-empty" hidden>NO AIRCRAFT IN THE AREA</div>
  </div>
</div>
<script>
(function () {
  var CFG = window.KIOSK_FLIGHT_CONFIG || {};
  var DATA = window.KIOSK_FLIGHT_DATA || null;

  function text(value, fallback) {
    return (value === undefined || value === null || value === '') ? (fallback || '') : String(value);
  }
  function on(value) { return String(value) !== 'false'; }
  function num(value) {
    var n = parseFloat(value);
    return isFinite(n) ? n : null;
  }
  function group(value) {
    var whole = String(Math.round(value));
    var out = '';
    while (whole.length > 3) { out = ',' + whole.slice(-3) + out; whole = whole.slice(0, -3); }
    return whole + out;
  }
  function deg(value) { return value === null ? '' : String(Math.round(value)); }

  var UNITS = {
    metric:   { dist: 'km', distFactor: 1,        alt: 'm',  altFactor: 0.3048, speed: 'km/h', speedFactor: 1.852 },
    aviation: { dist: 'nm', distFactor: 0.539957, alt: 'ft', altFactor: 1,      speed: 'kt',   speedFactor: 1 },
    imperial: { dist: 'mi', distFactor: 0.621371, alt: 'ft', altFactor: 1,      speed: 'mph',  speedFactor: 1.15078 }
  };
  var U = UNITS[text(CFG.units, 'metric')] || UNITS.metric;

  function distance(km) {
    if (km === null) { return ''; }
    return (km * U.distFactor).toFixed(km * U.distFactor < 10 ? 1 : 0) + ' ' + U.dist;
  }
  // Distance without the unit, for lists that share one unit label.
  function distValue(km) {
    if (km === null || km === undefined) { return ''; }
    var value = km * U.distFactor;
    return value < 10 ? value.toFixed(1) : String(Math.round(value));
  }
  function altitude(feet) {
    if (feet === null) { return ''; }
    var value = feet * U.altFactor;
    if (U.alt === 'ft') { return group(value / 100) + '00 ft'; }
    return group(value) + ' m';
  }
  function speed(knots) {
    if (knots === null) { return ''; }
    return group(knots * U.speedFactor) + ' ' + U.speed;
  }

  var radar = document.getElementById('radar');
  var grid = document.getElementById('grid');
  var trailLayer = document.getElementById('trails');
  var plots = document.getElementById('plots');
  var sweep = document.getElementById('sweep');
  var countEl = document.getElementById('count');
  var titleEl = document.getElementById('hud-title');
  var subEl = document.getElementById('hud-sub');
  var warnEl = document.getElementById('hud-warn');
  var notice = document.getElementById('notice');
  var foot = document.getElementById('foot');
  var detail = document.getElementById('detail');
  var pulse = document.querySelector('.home-pulse');
  // The single-aircraft dashboard (see the comment on #acdetail in the markup).
  var acdetail = document.getElementById('acdetail');
  var ICONS = window.KIOSK_FLIGHT_ICONS || {};

  var size = 600;          // radar square, in px
  var centre = { x: 300, y: 300 };
  var viewKm = 5;
  var planes = [];         // placed plot nodes, for hit-testing
  var gridObstacles = [];  // compass letters + area label, measured while drawing
  var areaBox = [];        // the sensor's coverage box, four [bearing, km] corners
  var areaKm = null;       // how far the sensor looks in each direction
  var selected = -1;
  var refreshSeconds = Math.max(5, num(CFG.refreshInterval) || 20);
  var timer = null;

  // --------------------------------------------------------------------------- //
  // Single-aircraft dashboard
  //
  // One aircraft, full screen: airline badge + name, flight number, a top-down
  // schematic of the type, altitude and origin → destination. It is either the
  // display's whole job (`detailAlways`) or a view the radar hands over to, on a
  // tap (`detailClick`) or when the sky has emptied down to a single aircraft
  // (`detailAuto`).
  //
  // `flag()` not `on()` for these three: `on()` treats a missing value as true,
  // which is right for the cosmetics (they default to on) and catastrophic here
  // — an unset flag would turn every radar into a dashboard.
  // --------------------------------------------------------------------------- //
  function flag(value) { return String(value) === 'true'; }
  var view = flag(CFG.detailAlways) ? 'detail' : 'radar';
  var detailTarget = '';    // callsign/name of a tapped aircraft; '' = the closest
  var loaded = false;       // has a data payload arrived yet
  // Airline logos for the aircraft in the CURRENT payload, by ICAO code, as
  // data: URIs the app built server-side. Empty until the app has fetched them
  // (the badge falls back to the monogram in the meantime).
  var LOGOS = {};

  function closestFlight(flights) {
    var best = null;
    for (var i = 0; i < flights.length; i++) {
      var d = num(flights[i].distanceKm);
      if (d === null) { continue; }
      if (!best || d < best.distanceKm) { best = flights[i]; }
    }
    return best || flights[0] || null;
  }

  // The aircraft the dashboard should be showing: the one that was tapped while
  // it is still in the area, otherwise the closest one.
  function targetFlight(flights) {
    if (detailTarget) {
      for (var i = 0; i < flights.length; i++) {
        if (flights[i].name === detailTarget) { return flights[i]; }
      }
      return null;             // it has left the area
    }
    return closestFlight(flights);
  }

  function initials(name) {
    var parts = String(name || '').split(/[\s-]+/);
    var out = '';
    for (var i = 0; i < parts.length && out.length < 2; i++) {
      if (/[A-Za-z]/.test(parts[i].charAt(0))) { out += parts[i].charAt(0).toUpperCase(); }
    }
    return out;
  }

  // A stable colour per airline, from its own code/name: same airline, same
  // colour on every kiosk, no lookup table and nothing to fetch.
  function airlineHue(seed) {
    var hash = 0;
    for (var i = 0; i < seed.length; i++) { hash = (hash * 31 + seed.charCodeAt(i)) % 360; }
    return hash;
  }

  // Deliberately named detailNodes, NOT detailRows: the radar already has a
  // `detailRows(flight)` for its bottom strip, and a second declaration of the
  // same name silently wins at EVERY call site (function declarations hoist) —
  // which called the strip's version with no aircraft to hand and killed the
  // whole render. Any new function here must be checked against the names below.
  function detailNodes() {
    return {
      airline: acdetail.querySelector('.ad-airline'),
      badge: acdetail.querySelector('.ad-badge'),
      badgeLogo: acdetail.querySelector('.ad-logo'),
      badgeText: acdetail.querySelector('.ad-monogram'),
      airlineText: acdetail.querySelector('.ad-airline-text'),
      airlineName: acdetail.querySelector('.ad-airline-name'),
      flight: acdetail.querySelector('.ad-flight'),
      schematic: acdetail.querySelector('.ad-schematic'),
      type: acdetail.querySelector('.ad-type'),
      model: acdetail.querySelector('.ad-model'),
      code: acdetail.querySelector('.ad-type .ad-code'),
      alt: acdetail.querySelector('.ad-alt'),
      altValue: acdetail.querySelector('.ad-alt-value'),
      route: acdetail.querySelector('.ad-route'),
      fromCode: acdetail.querySelector('.ad-from .ad-code'),
      fromCity: acdetail.querySelector('.ad-from .ad-city'),
      toCode: acdetail.querySelector('.ad-to .ad-code'),
      toCity: acdetail.querySelector('.ad-to .ad-city'),
      empty: acdetail.querySelector('.ad-empty')
    };
  }

  function renderDetail(flight, message) {
    var el = detailNodes();
    var show = !!flight;
    el.airline.hidden = !show;
    el.flight.hidden = !show;
    el.schematic.hidden = !show;
    el.type.hidden = !show;
    el.alt.hidden = !show;
    el.route.hidden = !show;
    // "No aircraft" is only honest once a payload has actually arrived: before
    // that the dashboard is simply still loading. A message (the app's own
    // error text) is always shown — a standalone dashboard must never fail silently.
    el.empty.textContent = message || 'NO AIRCRAFT IN THE AREA';
    el.empty.style.letterSpacing = message ? '.02em' : '';
    el.empty.hidden = show ? true : !(loaded || !!message);
    if (!show) { return; }

    // Airline: the real logo when the payload carries one for this airline,
    // otherwise the code badge. The logo arrives as a data: URI in the payload
    // (see the app's logo section), so it needs no network here and no URL that
    // would break inside the admin's srcdoc preview.
    var code = text(flight.airlineCode, '').toUpperCase();
    var airlineName = text(flight.airline, '');
    if (!code) { code = initials(airlineName); }
    el.airline.hidden = !(code || airlineName);
    var logo = LOGOS[text(flight.airlineIcao, '').toUpperCase()] || '';
    if (logo) {
      el.badgeLogo.src = logo;
      el.badgeLogo.alt = airlineName;
      el.badgeLogo.hidden = false;
      el.badgeText.textContent = '';
      el.badge.className = 'ad-badge has-logo';
    } else {
      // No logo yet (nothing cached, the setting is off, or the airline has no
      // file): the coloured monogram, in the same badge, until one arrives.
      el.badgeLogo.hidden = true;
      el.badgeLogo.removeAttribute('src');
      el.badgeLogo.alt = '';
      el.badgeText.textContent = code || '✈';
      el.badge.className = 'ad-badge';
      el.badge.style.background = 'hsl(' + airlineHue(code || airlineName) + ',72%,66%)';
    }
    // The logo says who the airline is; the name beside it is then the same
    // information twice, so it only appears when the badge is a bare code.
    el.airlineText.hidden = !!logo;
    el.airlineName.textContent = airlineName;

    el.flight.textContent = text(flight.flight || flight.name, 'Unknown');

    // The schematic, plus what it is a schematic OF — an icon on its own leaves
    // the viewer guessing which A320-family member it stands for.
    var icon = flight.icon ? ICONS[flight.icon] : '';
    el.schematic.innerHTML = icon || '';
    if (!icon) {
      // Nothing to draw (an airport vehicle, or an icon the app does not ship):
      // fall back to the same glyph the radar plots, unrotated.
      var glyph = planeGlyph();
      el.schematic.innerHTML = glyph.outerHTML;
    }
    var model = text(flight.model, flight.type);
    el.type.hidden = !model && !flight.code;
    el.model.textContent = model;
    el.code.textContent = flight.code && flight.code !== model ? flight.code : '';

    if (flight.onGround) {
      el.altValue.textContent = 'ON THE GROUND';
    } else if (flight.altitude !== null && flight.altitude !== undefined && flight.altitude > 100) {
      el.altValue.textContent = altitude(flight.altitude);
    } else {
      el.altValue.textContent = '—';
    }

    var from = text(flight.originCode, ''), to = text(flight.destinationCode, '');
    var fromCity = text(flight.originCity, ''), toCity = text(flight.destinationCity, '');
    el.route.hidden = !(from || to || fromCity || toCity);
    el.fromCode.textContent = from || fromCity;
    el.fromCity.textContent = from ? fromCity : '';
    el.toCode.textContent = to || toCity;
    el.toCity.textContent = to ? toCity : '';
  }

  function setView(next) {
    view = next;
    document.body.className = next === 'detail' ? 'detail' : '';
  }

  // Decide which view this refresh belongs in. Reached from every render(), so
  // the dashboard appears and disappears with the traffic without a reload.
  function updateView(flights, error) {
    var flight = targetFlight(flights);
    if (flag(CFG.detailAlways)) {
      setView('detail');
    } else if (error) {
      // The error text lives on the radar (inside #notice), so a broken display
      // must be on the radar view to show it — that is the whole point of not
      // swallowing render/read failures.
      detailTarget = '';
      setView('radar');
    } else if (view === 'detail') {
      // Leave when the reason for being here is gone: the tapped aircraft has
      // left the area, or the sky has filled up again.
      var leaving = detailTarget ? !flight
        : (!flag(CFG.detailAuto) || flights.length !== 1);
      if (leaving) { detailTarget = ''; setView('radar'); }
    } else if (flag(CFG.detailAuto) && flights.length === 1) {
      detailTarget = '';
      setView('detail');
    }
    if (view === 'detail') { renderDetail(flight, error || ''); }
  }

  function showRadar() {
    if (flag(CFG.detailAlways)) { return; }
    detailTarget = '';
    setView('radar');
    renderLast();
  }

  // --------------------------------------------------------------------------- //
  // Accent colour
  //
  // This setting existed but nothing read it, so choosing a colour changed nothing.
  // Everything that should follow it is derived from it here and injected as one
  // rule set (injected last, so it wins over the defaults of equal specificity).
  // --------------------------------------------------------------------------- //
  function hexToRgb(hex) {
    var value = String(hex || '').replace('#', '');
    if (!/^[0-9a-fA-F]{6}$/.test(value)) { value = '7dd3fc'; }
    return [parseInt(value.slice(0, 2), 16), parseInt(value.slice(2, 4), 16),
            parseInt(value.slice(4, 6), 16)];
  }
  function lighten(rgb, amount) {
    var out = [];
    for (var i = 0; i < 3; i++) { out.push(Math.round(rgb[i] + (255 - rgb[i]) * amount)); }
    return out;
  }
  var accentRgb = hexToRgb(CFG.accent);
  var accent = 'rgb(' + accentRgb.join(',') + ')';
  var accentSoft = 'rgba(' + accentRgb.join(',') + ',';
  var accentBright = 'rgb(' + lighten(accentRgb, 0.72).join(',') + ')';

  function applyAccent() {
    var css = [
      '.glyph path{fill:' + accent + '}',
      '.ac.near .glyph path{fill:' + accentBright + '}',
      '.ac.near .glyph{filter:drop-shadow(0 0 7px ' + accentSoft + '.85))}',
      '.trail{stroke:' + accent + '}',
      '.ring{stroke:' + accentSoft + '.16)}',
      '.ring.major{stroke:' + accentSoft + '.24)}',
      '.tick{stroke:' + accentSoft + '.30)}',
      '.card{fill:' + accentSoft + '.60)}',
      '.areabox{fill:' + accentSoft + '.035);stroke:' + accentSoft + '.30)}',
      '.arealabel{fill:' + accentSoft + '.62)}',
      '.home-dot{box-shadow:0 0 0 3px ' + accentSoft + '.25),0 0 18px ' + accentSoft + '.75)}',
      '.home-pulse{border-color:' + accentSoft + '.55)}',
      '#count{text-shadow:0 0 30px ' + accentSoft + '.35)}',
      // The single-aircraft dashboard follows the accent too (the airline badge
      // keeps its own per-airline colour — that one identifies the airline).
      '#acdetail .ad-schematic{color:' + accent + '}',
      '#acdetail .ad-schematic{filter:drop-shadow(0 0 2.2vmin ' + accentSoft + '.35))}',
      '#acdetail .ad-arrow{color:' + accent + '}',
      '#acdetail .ad-flight{text-shadow:0 0 4vmin ' + accentSoft + '.35)}',
      '#acdetail .ad-alt{text-shadow:0 0 3vmin ' + accentSoft + '.30)}'
    ].join('\n');
    var style = document.createElement('style');
    style.appendChild(document.createTextNode(css));
    document.head.appendChild(style);
  }

  // --------------------------------------------------------------------------- //
  // Text sizes: each element group gets its own percentage of the design size.
  // --------------------------------------------------------------------------- //
  function pct(value) {
    var number = num(value);
    return (number === null || number < 10) ? 100 : number;
  }
  function scaled(baseVmin, percent) {
    return (baseVmin * percent / 100).toFixed(3) + 'vmin';
  }
  function applyTextScale() {
    var wide = (window.innerWidth || 0) >= (window.innerHeight || 0);
    var details = pct(CFG.sizeDetails);
    countEl.style.fontSize = scaled(wide ? 13 : 9, pct(CFG.sizeCount));
    titleEl.style.fontSize = scaled(2.1, pct(CFG.sizeTitle));
    subEl.style.fontSize = scaled(1.9, pct(CFG.sizeInfo));
    warnEl.style.fontSize = scaled(1.75, pct(CFG.sizeInfo));
    foot.style.fontSize = scaled(1.6, pct(CFG.sizeFooter));
    notice.querySelector('.big').style.fontSize = scaled(3, pct(CFG.sizeTitle));
    notice.querySelector('.small').style.fontSize = scaled(1.9, pct(CFG.sizeInfo));
    detail.querySelector('.d-call').style.fontSize = scaled(4.2, pct(CFG.sizeCallsign));
    detail.querySelector('.d-route').style.fontSize = scaled(2.2, details);
    detail.querySelector('.d-rows').style.fontSize = scaled(1.7, details);
    // The dashboard scales as one piece: every size in its CSS is a multiple of
    // this factor, so one slider moves the lot without a layout of its own.
    document.documentElement.style.setProperty('--ds', String(pct(CFG.sizeDetail) / 100));
  }

  function layout() {
    var w = window.innerWidth || document.documentElement.clientWidth;
    var h = window.innerHeight || document.documentElement.clientHeight;
    size = Math.max(220, Math.round(Math.min(w, h) * 0.94));
    radar.style.width = size + 'px';
    radar.style.height = size + 'px';
    centre = { x: size / 2, y: size / 2 };
    grid.setAttribute('width', size);
    grid.setAttribute('height', size);
    trailLayer.setAttribute('width', size);
    trailLayer.setAttribute('height', size);
    drawSweep();
    applyTextScale();
  }

  // A radar sweep is an ANGULAR fade trailing a bright leading edge, so it is drawn
  // as stacked wedges here rather than with a CSS gradient box. It MUST be sized to
  // the radar: an SVG with no width/height is 300x150, and the wedge (drawn in radar
  // pixels) is then clipped to that box and spins as a sliver off the centre — which
  // is exactly how it looked wrong.
  function sweepPath(radius, fromDeg, toDeg) {
    var from = fromDeg * Math.PI / 180;
    var to = toDeg * Math.PI / 180;
    var x1 = centre.x + radius * Math.sin(from);
    var y1 = centre.y - radius * Math.cos(from);
    var x2 = centre.x + radius * Math.sin(to);
    var y2 = centre.y - radius * Math.cos(to);
    return 'M ' + centre.x + ' ' + centre.y + ' L ' + x1.toFixed(1) + ' ' + y1.toFixed(1)
      + ' A ' + radius + ' ' + radius + ' 0 0 1 ' + x2.toFixed(1) + ' ' + y2.toFixed(1) + ' Z';
  }

  function drawSweep() {
    var svg = document.getElementById('sweep-svg');
    svg.setAttribute('width', size);
    svg.setAttribute('height', size);
    while (svg.firstChild) { svg.removeChild(svg.firstChild); }
    if (!on(CFG.showSweep)) { return; }
    var radius = size / 2 - 2;
    var bands = 8, span = 7;                  // 56 degrees of trail behind the edge
    for (var i = bands; i >= 1; i--) {
      var alpha = 0.02 + 0.16 * (1 - (i - 1) / bands);
      svg.appendChild(svgNode('path', {
        d: sweepPath(radius, -(i * span), -((i - 1) * span)),
        fill: accentSoft + alpha.toFixed(3) + ')'
      }));
    }
    svg.appendChild(svgNode('line', { x1: centre.x, y1: centre.y, x2: centre.x, y2: centre.y - radius,
      stroke: accentBright, 'stroke-width': Math.max(1.4, size / 480), 'stroke-opacity': 0.6 }));
  }

  // Polar -> screen: north up, bearing clockwise.
  function project(bearing, km) {
    var radius = size / 2 - 6;
    var r = viewKm > 0 ? Math.min(1, km / viewKm) * radius : 0;
    var rad = bearing * Math.PI / 180;
    return { x: centre.x + r * Math.sin(rad), y: centre.y - r * Math.cos(rad) };
  }

  function svgNode(name, attrs) {
    var node = document.createElementNS('http://www.w3.org/2000/svg', name);
    for (var key in attrs) { if (attrs.hasOwnProperty(key)) { node.setAttribute(key, attrs[key]); } }
    return node;
  }

  function drawGrid(rings, bearing) {
    grid.innerHTML = '';
    gridObstacles = [];
    var radius = size / 2 - 6;
    // SVG text does not follow the CSS viewport units used elsewhere, so the
    // scale-dependent grid labels are sized from the radar itself, times the
    // "Compass & area labels" text-size setting.
    var gridPct = pct(CFG.sizeGrid) / 100;
    var cardFont = Math.max(10, Math.round((size / 45) * gridPct));
    var showRings = on(CFG.showRings);
    if (showRings) {
      for (var i = 0; i < rings.length; i++) {
        var r = radius * Math.min(1, rings[i] / viewKm);
        grid.appendChild(svgNode('circle', { 'class': 'ring' + (i === rings.length - 1 ? ' major' : ''),
          cx: centre.x, cy: centre.y, r: r.toFixed(1) }));
        // Each ring gets a small tick where the distances are anchored, but the
        // distance TEXT lives in the HUD instead: text sitting on the scope is one more
        // thing an aircraft label can collide with, and this is a crowded sky.
        var anchor = project(bearing, rings[i]);
        var inward = project(bearing, rings[i] * 0.97);
        grid.appendChild(svgNode('line', { 'class': 'tick', x1: inward.x.toFixed(1), y1: inward.y.toFixed(1),
          x2: anchor.x.toFixed(1), y2: anchor.y.toFixed(1) }));
      }
    }
    // Outer boundary + cardinal ticks.
    grid.appendChild(svgNode('circle', { 'class': 'cosmetic', cx: centre.x, cy: centre.y, r: radius }));
    // The area the sensor actually watches, from its own `bounds`: aircraft are only
    // ever reported from inside it, so it answers "why is nothing showing?" at a glance.
    if (areaBox.length === 4) {
      var corners = [];
      for (var b = 0; b < areaBox.length; b++) {
        corners.push(project(areaBox[b][0], areaBox[b][1]));
      }
      var points = [];
      for (var c2 = 0; c2 < corners.length; c2++) {
        points.push(corners[c2].x.toFixed(1) + ',' + corners[c2].y.toFixed(1));
      }
      grid.appendChild(svgNode('polygon', { 'class': 'areabox', points: points.join(' ') }));
      var mid = { x: (corners[0].x + corners[1].x) / 2, y: (corners[0].y + corners[1].y) / 2 };
      var areaFont = Math.max(10, Math.round((size / 68) * gridPct));
      var areaNode = svgNode('text', { 'class': 'arealabel', 'font-size': areaFont,
        x: mid.x.toFixed(1), y: (mid.y + areaFont * 1.4).toFixed(1) });
      areaNode.textContent = 'sensor area ' + (areaKm ? distance(areaKm) : '');
      grid.appendChild(areaNode);
      noteGridText(areaNode, 4);
    }
    var cardinals = [['N', 0], ['E', 90], ['S', 180], ['W', 270]];
    for (var c = 0; c < cardinals.length; c++) {
      var bearing = cardinals[c][1];
      var outer = project(bearing, viewKm * 0.99);
      var inner = project(bearing, viewKm * 0.93);
      grid.appendChild(svgNode('line', { 'class': 'tick', x1: inner.x.toFixed(1), y1: inner.y.toFixed(1),
        x2: outer.x.toFixed(1), y2: outer.y.toFixed(1) }));
      var at = project(bearing, viewKm * 0.965);
      var node = svgNode('text', { 'class': 'card', 'font-size': cardFont,
        x: at.x.toFixed(1), y: (at.y + cardFont * 0.34).toFixed(1) });
      node.textContent = cardinals[c][0];
      grid.appendChild(node);
      noteGridText(node, 6);
    }
  }

  // Grid text is a real obstacle for aircraft labels: measuring it keeps "10 km"
  // and the compass letters from being printed over by a callsign.
  function noteGridText(node, padding) {
    var box = node.getBoundingClientRect();
    var base = radar.getBoundingClientRect();
    gridObstacles.push({
      x: box.x - base.x - padding, y: box.y - base.y - padding,
      w: box.width + padding * 2, h: box.height + padding * 2, grid: true
    });
  }

  function overlaps(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  // Cost of putting a label here. Covering the compass letters or a range label
  // (100) is worse than covering another aircraft's label (10), and a label that
  // runs off the scope is a last resort (10 per edge).
  function placementCost(candidate, obstacles) {
    var cost = 0;
    for (var i = 0; i < obstacles.length; i++) {
      if (overlaps(candidate, obstacles[i])) {
        cost += obstacles[i].grid ? 100 : 10;
      }
    }
    if (candidate.x < 0) { cost += 10; }
    if (candidate.y < 0) { cost += 10; }
    if (candidate.x + candidate.w > size) { cost += 10; }
    if (candidate.y + candidate.h > size) { cost += 10; }
    return cost;
  }

  function angularGap(a, b) {
    var gap = Math.abs(a - b) % 360;
    return gap > 180 ? 360 - gap : gap;
  }

  // Range labels go on the diagonal furthest from every aircraft, best first: a fixed
  // diagonal is guaranteed to be crossed by the label of whatever flies along it,
  // which showed up as "20 km" printed through a callsign.
  function ringLabelBearings(flights) {
    var diagonals = [45, 135, 225, 315];
    var scored = [];
    for (var c = 0; c < diagonals.length; c++) {
      var score = 181;
      for (var i = 0; i < flights.length; i++) {
        var bearing = num(flights[i].bearing);
        if (bearing === null) { continue; }
        var gap = angularGap(bearing, diagonals[c]);
        if (gap < score) { score = gap; }
      }
      scored.push({ bearing: diagonals[c], score: score });
    }
    scored.sort(function (a, b) { return b.score - a.score; });
    var ordered = [];
    for (var s = 0; s < scored.length; s++) { ordered.push(scored[s].bearing); }
    return ordered;
  }

  function drawTrails(flights) {
    trailLayer.innerHTML = '';
    if (!on(CFG.showTrails)) { return; }
    for (var i = 0; i < flights.length; i++) {
      var trail = flights[i].trail || [];
      if (trail.length < 2) { continue; }
      var points = [];
      for (var t = 0; t < trail.length; t++) {
        var at = project(trail[t][0], trail[t][1]);
        points.push(at.x.toFixed(1) + ',' + at.y.toFixed(1));
      }
      trailLayer.appendChild(svgNode('polyline', { 'class': 'trail', points: points.join(' ') }));
    }
  }

  function planeGlyph() {
    var svg = svgNode('svg', { 'class': 'glyph', viewBox: '-10 -10 20 20' });
    var path = svgNode('path', { d: 'M0 -9 L1.7 -3 L8 1 L8 3.2 L1.7 2.2 L1.3 6.4 L3.4 8.4 ' +
      'L3.4 9.6 L0 8.8 L-3.4 9.6 L-3.4 8.4 L-1.3 6.4 L-1.7 2.2 L-8 3.2 L-8 1 L-1.7 -3 Z' });
    svg.appendChild(path);
    return svg;
  }

  function metaLine(flight) {
    var parts = [];
    if (on(CFG.showDistance)) { parts.push(distance(flight.distanceKm)); }
    if (on(CFG.showSpeed) && flight.speed !== null && flight.speed !== undefined) {
      parts.push(speed(flight.speed));
    }
    if (on(CFG.showType) && flight.type) { parts.push(flight.type); }
    return parts.join('  ·  ');
  }

  function drawPlanes(flights) {
    plots.innerHTML = '';
    planes = [];
    var glyphSize = Math.max(16, Math.round(size / 19));
    var gap = Math.round(glyphSize * 0.72 + 8);
    var band = Math.max(30, Math.round(size / 24));
    // Label text sizes: their own settings, applied before the box is measured below so
    // collision placement uses the real rendered size.
    var callPct = pct(CFG.sizeCallsign);
    var detailPct = pct(CFG.sizeDetails);
    // Obstacles a label must not be printed over: the home marker, the footer strip,
    // and every compass letter / range label measured while the grid was drawn.
    var placed = gridObstacles.slice();
    placed.push({ x: centre.x - size * 0.09, y: centre.y - band / 2, w: size * 0.18, h: band });
    placed.push({ x: -size, y: size - band * 1.3, w: size * 3, h: band * 1.6, ground: true });
    for (var i = 0; i < flights.length; i++) {
      var flight = flights[i];
      var at = project(flight.bearing, flight.distanceKm);
      var node = document.createElement('div');
      // Labels always sit INWARD (towards the centre): a label hung outside passes
      // over the compass letters and off the scope on an edge aircraft.
      node.className = 'ac' + (i === 0 ? ' near' : '') + (at.x > centre.x ? ' left' : ' right');
      node.style.left = at.x.toFixed(1) + 'px';
      node.style.top = at.y.toFixed(1) + 'px';
      var glyph = planeGlyph();
      glyph.style.width = glyphSize + 'px';
      glyph.style.height = glyphSize + 'px';
      glyph.style.transform = 'rotate(' + (flight.heading === null ? 0 : flight.heading) + 'deg)';
      node.appendChild(glyph);

      var tag = document.createElement('div');
      tag.className = 'tag';
      var call = document.createElement('span');
      call.className = 'call';
      call.style.fontSize = scaled(2.5, callPct);
      call.textContent = text(flight.name, 'Unknown');
      if (flight.trend === 'climb' || flight.trend === 'descent') {
        var trend = document.createElement('span');
        trend.className = 'trend ' + flight.trend;
        trend.textContent = flight.trend === 'climb' ? ' ▲' : ' ▼';
        call.appendChild(trend);
      }
      tag.appendChild(call);
      var altitudeText = '';
      if (flight.onGround) {
        // Only reachable when "hide aircraft on the ground" is off — say so instead of
        // printing a meaningless 0 ft.
        altitudeText = 'on the ground';
      } else if (flight.altitude !== null && flight.altitude !== undefined
          && flight.altitude > 100) {
        altitudeText = altitude(flight.altitude);
      }
      var meta = metaLine(flight);
      if (altitudeText || meta) {
        var metaNode = document.createElement('span');
        metaNode.className = 'meta';
        metaNode.style.fontSize = scaled(1.85, detailPct);
        metaNode.textContent = [altitudeText, meta].filter(Boolean).join('  ·  ');
        tag.appendChild(metaNode);
      }
      if (on(CFG.showRoute)) {
        var routeText = routeLine(flight);
        if (routeText) {
          var routeNode = document.createElement('span');
          routeNode.className = 'route';
          routeNode.style.fontSize = scaled(1.7, detailPct);
          routeNode.textContent = routeText;
          tag.appendChild(routeNode);
        }
      }
      node.appendChild(tag);
      node.setAttribute('data-index', String(i));
      plots.appendChild(node);

      // Label placement: inward, then the first free slot in a bounded ladder of
      // vertical offsets. Overlap resolution must terminate — a push-away loop can
      // bounce between two neighbours forever, which is how labels used to collide.
      // Two anchor sides × the ladder, scored: range labels sit on a diagonal, so a
      // label anchored on the wrong side crosses them however far it is moved.
      var width = tag.offsetWidth || 0;
      var height = tag.offsetHeight || band;
      // Preferred side: an aircraft near the centre would drop its label onto the home
      // marker (or onto another near-centre label) if it pointed inward, so those hang
      // OUTWARD; further out, inward keeps the label inside the scope and clear of the
      // compass letters. The scored search still tries both.
      var offsetX = at.x - centre.x, offsetY = at.y - centre.y;
      var fromCentre = Math.sqrt(offsetX * offsetX + offsetY * offsetY);
      var preferLeft = fromCentre < (size / 2) * 0.35 ? (at.x < centre.x) : (at.x > centre.x);
      var sides = preferLeft ? [true, false] : [false, true];
      var chosen = null, bestCost = Infinity;
      for (var si = 0; si < sides.length && bestCost > 0; si++) {
        var anchorX = sides[si] ? at.x - gap - width : at.x + gap;
        for (var step = 0; step <= 7 && bestCost > 0; step++) {
          var offsets = step === 0 ? [0] : [-step, step];
          for (var oi = 0; oi < offsets.length; oi++) {
            var candidate = { x: anchorX, y: at.y - height / 2 + offsets[oi] * (band + 6),
                              w: width, h: height, left: sides[si] };
            var cost = placementCost(candidate, placed);
            if (cost < bestCost) {
              bestCost = cost;
              chosen = candidate;
            }
            if (cost === 0) { break; }
          }
        }
      }
      tag.style.marginTop = (chosen.y + chosen.h / 2 - at.y).toFixed(0) + 'px';
      if (chosen.left) { tag.style.right = gap + 'px'; tag.style.left = 'auto'; }
      else { tag.style.left = gap + 'px'; tag.style.right = 'auto'; }
      placed.push(chosen);
      planes.push({ flight: flight, node: node, x: at.x, y: at.y });
    }
  }

  function routeLine(flight) {
    var from = flight.originCode || flight.originCity;
    var to = flight.destinationCode || flight.destinationCity;
    if (from && to) { return from + '  →  ' + to; }
    // Never fall back to the callsign/registration: the label's first line already
    // shows it, and "EI-HAP" printed twice reads like a bug.
    if (flight.airline) { return flight.airline; }
    return '';
  }

  function showNotice(big, small, isError) {
    // The notice lives on the radar, and the dashboard covers the radar: an
    // exception thrown mid-render (before updateView() ever runs) would otherwise
    // be reported to a screen nobody can see. An error the user cannot read is
    // worse than any layout glitch, so bring the radar forward for it.
    if (isError) { setView('radar'); }
    notice.hidden = false;
    notice.className = isError ? 'error' : '';
    notice.querySelector('.big').textContent = big;
    notice.querySelector('.small').textContent = small || '';
  }

  function detailRows(flight) {
    var rows = [];
    if (flight.registration) { rows.push('Registration ' + flight.registration); }
    if (flight.type) { rows.push(flight.type); }
    if (flight.airline) { rows.push(flight.airline); }
    if (flight.originCity || flight.destinationCity) {
      rows.push(text(flight.originCity, flight.originCode) + ' → '
        + text(flight.destinationCity, flight.destinationCode));
    }
    rows.push('Altitude ' + (flight.altitude ? altitude(flight.altitude) : '—')
      + '   Speed ' + (flight.speed ? speed(flight.speed) : '—'));
    rows.push('Distance ' + distance(flight.distanceKm) + ' at ' + deg(flight.bearing) + '°');
    return rows;
  }

  function renderSelected() {
    var scrim = document.getElementById('scrim');
    if (selected < 0 || selected >= planes.length) {
      detail.hidden = true;
      scrim.className = '';
      return;
    }
    var flight = planes[selected].flight;
    detail.querySelector('.d-call').textContent = text(flight.name, 'Unknown');
    var routeText = routeLine(flight);
    detail.querySelector('.d-route').textContent = routeText && routeText.indexOf('→') > 0 ? routeText : '';
    detail.querySelector('.d-rows').textContent = detailRows(flight).join('   ');
    detail.hidden = false;
    scrim.className = 'on';
  }

  function render(data) {
    viewKm = num(data.viewKm) || 5;
    LOGOS = data.logos || {};
    // The sensor's own coverage, set before the grid is drawn.
    areaBox = (data.areaBox && data.areaBox.length === 4) ? data.areaBox : [];
    areaKm = num(data.areaKm);
    var hiddenGround = num(data.hiddenGround) || 0;
    layout();
    var rings = data.rings && data.rings.length ? data.rings : [viewKm / 2, viewKm];
    var flights = data.flights || [];
    drawTrails(flights);
    // Range ticks go on the diagonal furthest from the traffic (cosmetic), but the
    // ring DISTANCES are text in the HUD, so there is no scope text to collide with.
    var bearings = ringLabelBearings(flights);
    drawGrid(rings, bearings[0]);
    drawPlanes(flights);
    var total = num(data.total);
    countEl.textContent = String(total === null ? flights.length : total);
    titleEl.textContent = text(CFG.title, 'AIRCRAFT OVERHEAD');
    var bits = [];
    if (flights.length) {
      bits.push('nearest <b>' + distance(flights[0].distanceKm) + '</b>');
      var highest = null;
      for (var i = 0; i < flights.length; i++) {
        if (flights[i].altitude !== null && (highest === null || flights[i].altitude > highest)) {
          highest = flights[i].altitude;
        }
      }
      if (highest !== null) { bits.push('highest <b>' + altitude(highest) + '</b>'); }
      if (rings.length) {
        var ringText = [];
        for (var ri = 0; ri < rings.length; ri++) { ringText.push(distValue(rings[ri])); }
        bits.push('rings <b>' + ringText.join(' · ') + '</b> ' + U.dist);
      }
    }
    subEl.innerHTML = bits.join('<br>');
    warnEl.textContent = text(data.warning, '');

    if (data.error) {
      showNotice(data.error, 'Check the Flightradar24 integration in Home Assistant.', true);
    } else if (!flights.length) {
      // Be explicit about WHY it is empty: the sensor's own area is the thing that
      // sets which aircraft can ever appear, and it is not this app's setting.
      var why = [];
      if (areaKm) {
        why.push('This sensor reports aircraft within about ' + distance(areaKm)
          + ' of home — nothing outside that area reaches the display.');
      }
      if (hiddenGround) {
        why.push(hiddenGround + (hiddenGround === 1 ? ' aircraft on the ground is hidden'
          : ' aircraft on the ground are hidden') + ' (turn that off in the display settings).');
      }
      why.push('To see traffic further out, widen the Flightradar24 integration\'s area '
        + '(Settings → Devices & services → Flightradar24 → Configure).');
      showNotice('No aircraft in the sensor area', why.join(' '), false);
    } else {
      notice.hidden = true;
    }
    // The footer is a fixed credit line in the markup; nothing to update here.
    // Hide the HOME caption when aircraft are directly overhead: its label would be
    // the thing the nearest aircraft's label needs. The dot itself always stays.
    var nearest = null;
    for (var n = 0; n < flights.length; n++) {
      var d = num(flights[n].distanceKm);
      if (d !== null && (nearest === null || d < nearest)) { nearest = d; }
    }
    var hideHome = nearest !== null && viewKm > 0 && nearest < viewKm * 0.25;
    document.getElementById('home').className = hideHome ? 'quiet' : '';
    loaded = true;
    renderSelected();
    updateView(flights, text(data.error, ''));
  }

  function currentPath() {
    var path = location.pathname;
    if (path.charAt(path.length - 1) === '/') { path = path.slice(0, -1); }
    return path;
  }
  function authSuffix() {
    var fromUrl = new URLSearchParams(location.search).get('auth') || '';
    var token = fromUrl || text(CFG.authToken, '');
    return token ? '?auth=' + encodeURIComponent(token) : '';
  }
  function apiPath() {
    var id = currentPath().split('/').pop();
    return currentPath().replace(/\/display\/[^/]+$/, '/api/flights/' + id) + authSuffix();
  }

  function refresh() {
    fetchData(function (data) {
      try {
        render(data);
      } catch (error) {
        // A render failure must be VISIBLE. Swallowing it leaves a blank scope with no
        // clue why — which is exactly how a ReferenceError hid itself during development.
        showNotice('Display error', String(error), true);
      }
    });
  }

  function fetchData(callback) {
    var request = new XMLHttpRequest();
    request.open('GET', apiPath(), true);
    request.setRequestHeader('X-Access-Token', text(CFG.authToken, ''));
    request.onreadystatechange = function () {
      if (request.readyState !== 4) { return; }
      if (request.status === 200) {
        try { callback(JSON.parse(request.responseText)); return; }
        catch (error) { /* fall through to the error path */ }
      }
      callback({ error: 'Could not read flights from the app (HTTP ' + request.status + ').',
                 flights: [], total: 0, viewKm: viewKm, rings: [viewKm / 2, viewKm] });
    };
    try { request.send(); }
    catch (error) {
      callback({ error: 'The app is unreachable from this device.', flights: [], total: 0,
                 viewKm: viewKm, rings: [viewKm / 2, viewKm] });
    }
  }

  plots.addEventListener('click', function (event) {
    var node = event.target;
    while (node && node !== plots && !node.getAttribute('data-index')) { node = node.parentNode; }
    if (node && node !== plots) {
      var index = parseInt(node.getAttribute('data-index'), 10);
      // Tap-to-open-the-dashboard takes precedence over the bottom detail strip:
      // showing the strip for one frame and then covering the screen with the
      // dashboard is a visible flicker on the kiosk.
      if (flag(CFG.detailClick) && !flag(CFG.detailAlways) && planes[index]) {
        detailTarget = planes[index].flight.name;
        selected = -1;
        setView('detail');
        renderDetail(planes[index].flight);
        return;
      }
      selected = (selected === index) ? -1 : index;
      renderSelected();
    } else {
      selected = -1;
      renderSelected();
    }
  });
  // Tapping the dashboard itself goes back to the radar. In auto mode the next
  // refresh brings it straight back while there is still just one aircraft —
  // which is the point of auto mode, and why this only says "tap to go back".
  acdetail.addEventListener('click', function () { showRadar(); });
  window.addEventListener('resize', function () {
    layout();
    if (planes.length) { renderLast(); }
  });

  var last = DATA;
  function renderLast() { if (last) { render(last); } }

  // A page that arrives with its data embedded (the admin's unsaved-settings
  // preview) is a snapshot: it must NOT poll. Inside an iframe built from srcdoc
  // there is no usable base URL, so a refresh would 404 over a correct render.
  var EMBEDDED = !!DATA;

  sweep.className = on(CFG.showSweep) ? '' : 'off';
  pulse.className = 'home-pulse' + (on(CFG.showPulse) ? '' : ' off');
  applyAccent();
  layout();
  // A standalone dashboard starts as one — no radar frame flashes first.
  setView(view);
  if (view === 'detail') { renderDetail(null); }
  if (DATA) {
    try { render(DATA); } catch (error) { showNotice('Display error', String(error), true); }
  } else {
    countEl.textContent = '·';
    subEl.textContent = 'Loading…';
  }
  if (!EMBEDDED) {
    refresh();
    timer = window.setInterval(refresh, refreshSeconds * 1000);
    // A full reload every 30 minutes keeps a long-running kiosk on the current
    // client code, since the page is served with Cache-Control: no-store.
    window.setTimeout(function () { location.reload(); }, 30 * 60 * 1000);
  }
  void timer;
})();
</script>
</body>
</html>
